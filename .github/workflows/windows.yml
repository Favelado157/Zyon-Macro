name: Instalador Windows
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: cmd
        run: build_windows.bat
      - name: Verificar instalação e reabertura automática
        shell: pwsh
        run: |
          $setup = Start-Process -FilePath "$PWD/installer/GhosttzzKBot-Setup.exe" -ArgumentList '/VERYSILENT','/NORESTART','/GHOST_UPDATE' -PassThru
          if (!$setup.WaitForExit(60000)) { throw "Tempo de instalação excedido" }
          if ($setup.ExitCode -ne 0) { throw "Falha do instalador ($($setup.ExitCode))" }
          $deadline = (Get-Date).AddSeconds(20)
          $app = $null
          do {
            Start-Sleep -Milliseconds 500
            $app = Get-Process -Name GhosttzzKBot -ErrorAction SilentlyContinue |
              Where-Object { $_.MainWindowTitle -match '^GhosttzzKBot v[0-9]+\.[0-9]+\.[0-9]+$' } |
              Select-Object -First 1
          } while (!$app -and (Get-Date) -lt $deadline)
          if (!$app) { throw "O instalador não reabriu o painel" }
          Write-Host "Janela confirmada: $($app.MainWindowTitle)"
          $null = $app.CloseMainWindow()
          if (!$app.WaitForExit(10000)) { Stop-Process -Id $app.Id -Force }
      - shell: pwsh
        run: |
          Compress-Archive -Path 'installer/GhosttzzKBot-Setup.exe','LEIA-ME.txt' -DestinationPath 'installer/GhosttzzKBot-Windows11.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: GhosttzzKBot-Windows11
          path: app/installer/GhosttzzKBot-Windows11.zip
      - if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" installer/GhosttzzKBot-Windows11.zip --verify-tag --generate-notes
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
